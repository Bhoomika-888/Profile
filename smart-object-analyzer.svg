<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b172a"/>
      <stop offset="100%" stop-color="#07101f"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Application Window Frame -->
  <rect x="10" y="10" width="780" height="460" rx="14" fill="url(#windowBg)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Window Header -->
  <rect x="10" y="10" width="780" height="42" rx="14" fill="#0f172a" />
  <circle cx="32" cy="31" r="6" fill="#ef4444"/>
  <circle cx="52" cy="31" r="6" fill="#f59e0b"/>
  <circle cx="72" cy="31" r="6" fill="#10b981"/>
  
  <text x="400" y="36" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Smart Object Analyzer v1.0 • YOLOv5 &amp; OpenCV Vision Suite</text>
  <rect x="700" y="21" width="74" height="20" rx="10" fill="#0284c7" fill-opacity="0.2"/>
  <text x="737" y="35" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">PYTHON</text>

  <!-- Main Canvas / Viewport Area -->
  <rect x="25" y="65" width="530" height="340" rx="10" fill="#020817" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Grid background for computer vision canvas -->
  <path d="M 25 120 H 555 M 25 180 H 555 M 25 240 H 555 M 25 300 H 555 M 25 360 H 555" stroke="#0f1e36" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M 120 65 V 405 M 220 65 V 405 M 320 65 V 405 M 420 65 V 405 M 520 65 V 405" stroke="#0f1e36" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Simulated Detected Objects & Bounding Boxes -->
  <!-- Object 1: Laptop -->
  <rect x="180" y="160" width="180" height="150" rx="4" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
  <rect x="180" y="138" width="110" height="22" rx="3" fill="#00f2fe"/>
  <text x="188" y="153" fill="#000" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">laptop: 96.4%</text>
  <circle cx="270" cy="235" r="4" fill="#00f2fe" filter="url(#glow)"/>
  <text x="278" y="239" fill="#38bdf8" font-family="monospace" font-size="9">(x:270, y:235)</text>

  <!-- Object 2: Coffee Cup / Bottle -->
  <rect x="380" y="200" width="70" height="110" rx="4" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <rect x="380" y="178" width="90" height="22" rx="3" fill="#10b981"/>
  <text x="386" y="193" fill="#000" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">cup: 91.8%</text>
  <circle cx="415" cy="255" r="4" fill="#10b981"/>

  <!-- Object 3: Notebook / Book -->
  <rect x="70" y="220" width="95" height="90" rx="4" fill="none" stroke="#c084fc" stroke-width="2"/>
  <rect x="70" y="198" width="85" height="22" rx="3" fill="#a855f7"/>
  <text x="76" y="213" fill="#fff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">book: 88.2%</text>

  <!-- Crosshair in center -->
  <circle cx="290" cy="235" r="28" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="260" y1="235" x2="320" y2="235" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
  <line x1="290" y1="205" x2="290" y2="265" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

  <!-- Bottom Canvas Status -->
  <rect x="25" y="415" width="530" height="40" rx="8" fill="#0f172a"/>
  <text x="40" y="439" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="bold">YOLOv5 Inference: 18.2ms</text>
  <text x="210" y="439" fill="#94a3b8" font-family="sans-serif" font-size="11">Objects: 3 detected</text>
  <text x="345" y="439" fill="#94a3b8" font-family="sans-serif" font-size="11">Resolution: 1920x1080</text>
  <text x="495" y="439" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold">READY</text>

  <!-- Right Side Control Panel (OpenCV Tools & Operations) -->
  <rect x="570" y="65" width="205" height="390" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  <text x="585" y="92" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Vision Operations</text>
  
  <!-- Tab Buttons -->
  <rect x="585" y="106" width="85" height="24" rx="4" fill="#0284c7"/>
  <text x="627" y="122" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Detection</text>
  
  <rect x="677" y="106" width="85" height="24" rx="4" fill="#1e293b"/>
  <text x="719" y="122" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Compare</text>

  <!-- Enhancements & Controls -->
  <text x="585" y="155" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">IMAGE ENHANCEMENT</text>
  
  <!-- Brightness Slider -->
  <text x="585" y="180" fill="#94a3b8" font-family="sans-serif" font-size="10">Brightness (+15%)</text>
  <rect x="585" y="188" width="175" height="6" rx="3" fill="#1e293b"/>
  <rect x="585" y="188" width="115" height="6" rx="3" fill="#00f2fe"/>
  <circle cx="700" cy="191" r="5" fill="#ffffff"/>

  <!-- Blur Control -->
  <text x="585" y="215" fill="#94a3b8" font-family="sans-serif" font-size="10">Gaussian Blur (Kernel: 3x3)</text>
  <rect x="585" y="223" width="175" height="6" rx="3" fill="#1e293b"/>
  <rect x="585" y="223" width="60" height="6" rx="3" fill="#00f2fe"/>
  <circle cx="645" cy="226" r="5" fill="#ffffff"/>

  <!-- Zoom & Crop Buttons -->
  <g transform="translate(585, 245)">
    <rect x="0" y="0" width="82" height="28" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="41" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">🔍 Zoom In</text>
    
    <rect x="93" y="0" width="82" height="28" rx="5" fill="#1e293b" stroke="#334155"/>
    <text x="134" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="11" text-anchor="middle">✂ Crop Tool</text>
  </g>

  <!-- Feature Checklist -->
  <text x="585" y="305" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ACTIVE CAPABILITIES</text>
  
  <g transform="translate(585, 320)">
    <circle cx="6" cy="6" r="5" fill="#10b981"/>
    <text x="18" y="10" fill="#cbd5e1" font-family="sans-serif" font-size="10">YOLOv5 Classification</text>
    
    <circle cx="6" cy="26" r="5" fill="#10b981"/>
    <text x="18" y="30" fill="#cbd5e1" font-family="sans-serif" font-size="10">Bounding Coordinates</text>

    <circle cx="6" cy="46" r="5" fill="#10b981"/>
    <text x="18" y="50" fill="#cbd5e1" font-family="sans-serif" font-size="10">Image Difference Diff</text>
    
    <circle cx="6" cy="66" r="5" fill="#10b981"/>
    <text x="18" y="70" fill="#cbd5e1" font-family="sans-serif" font-size="10">OpenCV Filters</text>
  </g>

  <!-- Run Action Button -->
  <rect x="585" y="415" width="175" height="32" rx="6" fill="url(#accentCyan)"/>
  <text x="672" y="435" fill="#041226" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">▶ Run Analysis</text>
</svg>
